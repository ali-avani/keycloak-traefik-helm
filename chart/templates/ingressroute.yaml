{{- $host := .Values.host | required ".Values.host is required" -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  routes:
    - kind: Rule
      {{- if .Values.exposeAdmin }}
      match: Host(`{{ $host }}`)
      {{- else }}
      match: Host(`{{ $host }}`) && (PathPrefix(`/realms/`) || PathPrefix(`/resources/`)) && !PathPrefix(`/realms/master/`)
      {{- end }}
      services:
        - name: {{ .Release.Name }}
          port: 8080
  tls:
    certResolver: {{ .Values.certResolver }}
