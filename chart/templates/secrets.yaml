{{- $dbSecret := printf "%s-db-auth" .Release.Name -}}
{{- $adminSecret := printf "%s-bootstrap-admin" .Release.Name -}}
{{- $db := lookup "v1" "Secret" .Release.Namespace $dbSecret -}}
{{- $admin := lookup "v1" "Secret" .Release.Namespace $adminSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
data:
  username: {{ "keycloak" | b64enc }}
  password: {{ if $db }}{{ index $db.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ "temp-admin" | b64enc }}
  password: {{ if $admin }}{{ index $admin.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
